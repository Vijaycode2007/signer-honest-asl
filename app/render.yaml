# Render blueprint. Point Render at this repo and it reads this file.
#
# Memory, honestly: DeiT III base is 85.8M parameters. Widened to fp32 for CPU
# inference that is ~343 MB of weights, and the torch runtime around it wants
# another ~250 MB. It does NOT fit Render's 512 MB tiers - the free and starter
# plans will OOM on boot. `standard` (2 GB) is the smallest plan that runs this
# model. See app/README.md if you need to fit a smaller box.
services:
  - type: web
    name: sign-reader
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /api/health
    envVars:
      # Where the trained bundle is fetched from on first boot. Produce it with
      # `python app/train.py <manifest>`, then host it anywhere that serves a
      # plain GET: a GitHub release asset, a Hugging Face Hub file, a bucket.
      - key: SLR_WEIGHTS_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      # Persists the downloaded checkpoint across restarts and redeploys, so a
      # container restart does not re-download 172 MB.
      name: weights
      mountPath: /app/weights
      sizeGB: 1
